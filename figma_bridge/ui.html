<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px system-ui;padding:20px;color:#24212b;background:#f5f3fa}button{background:#6750a4;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}p{line-height:1.5}#status{font-size:12px}
</style></head><body><h2>Frame Bridge</h2><p>Select your screen frames. Positions, layers, and artwork are preserved. Complex layers become images.</p><p><label><input id="preserveText" type="checkbox" checked> Preserve text appearance as images</label><br><small>Turn off for native Flutter text. Custom fonts may differ.</small></p><button id="export">Export selection</button><p id="status">No network access. No project account.</p><script>
document.getElementById('export').onclick = () => parent.postMessage({pluginMessage:{type:'export',preserveText:document.getElementById('preserveText').checked}}, '*');
window.onmessage = event => {
  const message = event.data.pluginMessage; if (!message) return;
  const status = document.getElementById('status');
  if (typeof message.busy === 'boolean') { document.getElementById('export').disabled = message.busy; if (message.busy) status.textContent = 'Exporting artwork and layout…'; return; }
  if (message.error) { status.textContent = message.error; return; }
  if (typeof message.data !== 'string') return;
  const url = URL.createObjectURL(new Blob([message.data],{type:'application/json'}));
  const link = document.createElement('a'); link.href = url; link.download = 'figma.canvas-package.json'; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  status.textContent = 'Package exported. In Frame choose Figma import.';
};
</script></body></html>
